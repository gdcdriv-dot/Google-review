<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Golapbag Driver Center Review</title>
    
    <!-- WhatsApp & Social Media Link Preview Meta Tags (Open Graph) -->
    <meta property="og:title" content="Golapbag Driver Center">
    <meta property="og:description" content="আমাদের সার্ভিস কেমন লাগলো? গুগল রিভিউ দিন।">
    <meta property="og:image" content="https://files.catbox.moe/bx0dkv.png">
    <meta property="og:type" content="website">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Noto Sans Bengali', sans-serif;
            background-color: #e6edf3;
            -webkit-tap-highlight-color: transparent;
        }

        /* "Golapbag Driver Center" লেখাটির জন্য স্টাইলিশ ফন্ট ও ড্রপ-শ্যাডো */
        .stylish-heading {
            font-family: 'Oswald', sans-serif; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            color: #0f172a; 
            text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.35); 
        }

        @keyframes spin-border {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes color-shift {
            0% { background-color: #2563eb; } /* Blue */
            50% { background-color: #9333ea; } /* Purple */
            100% { background-color: #db2777; } /* Pink */
        }

        .animate-spin-slow {
            animation: spin-border 4s linear infinite;
        }
        
        .animate-spin-fast {
            animation: spin-border 2.5s linear infinite;
        }

        .bg-color-changing {
            animation: color-shift 6s ease-in-out infinite alternate;
        }
        
        /* বর্ডারের রঙের গ্র্যাডিয়েন্ট */
        .conic-border-gradient {
            background: conic-gradient(
                from 0deg, 
                transparent 0%, 
                #34d399 5%,   /* সবুজ */
                #fcd34d 30%,  /* হলুদ */
                #f472b6 60%,  /* গোলাপি */
                #38bdf8 85%,  /* নীল */
                #38bdf8 97%,  /* নীল */
                #ffffff 98.5%,/* সাদার শুরু */
                #ffffff 99.5%,/* ছোট্ট সাদা বিন্দু */
                transparent 100%
            );
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <main class="relative overflow-hidden rounded-[2rem] p-[5px] w-full max-w-[400px] min-h-[640px] shadow-2xl flex flex-col">
        
        <!-- মূল কার্ডের জন্য স্পিনিং ব্যাকগ্রাউন্ড -->
        <div class="absolute top-1/2 left-1/2 w-[1000px] h-[1000px] max-w-none conic-border-gradient animate-spin-slow pointer-events-none z-0" style="transform: translate(-50%, -50%);"></div>
        
        <!-- ভেতরের সাদা বক্স -->
        <div class="relative z-10 flex-grow w-full rounded-[1.7rem] bg-white flex flex-col items-center pt-6 px-8 pb-10 shadow-inner">
            
            <!-- লোগো র‍্যাপার -->
            <div class="relative overflow-hidden rounded-full p-[4px] w-32 h-32 mt-2 mb-5 shadow-lg">
                <!-- লোগোর জন্য স্পিনিং ব্যাকগ্রাউন্ড -->
                <div class="absolute top-1/2 left-1/2 w-[400px] h-[400px] max-w-none conic-border-gradient animate-spin-fast pointer-events-none z-0" style="transform: translate(-50%, -50%);"></div>
                
                <!-- লোগোর ছবি -->
                <img 
                    src="https://files.catbox.moe/bx0dkv.png" 
                    alt="Golapbag Driver Center Logo" 
                    class="relative z-10 w-full h-full object-cover rounded-full bg-transparent"
                >
            </div>

            <!-- লেখা -->
            <div class="text-center mt-0 flex-grow flex flex-col justify-start">
                <h2 class="text-3xl font-bold mb-4 stylish-heading">
                    Golapbag Driver Center
                </h2>
                <p class="text-[16px] leading-relaxed text-gray-600 font-medium px-2">
                    আমাদের সার্ভিস কেমন লাগলো? নিচে বাটনে ক্লিক করে গুগল রিভিউ দিন।
                </p>
            </div>

            <!-- রিভিউ বাটন -->
            <a 
                href="https://g.page/r/Ce0XcRk7WxijEAE/review" 
                target="_blank" 
                rel="noopener noreferrer"
                class="relative overflow-hidden rounded-full p-[4px] w-full mt-12 mb-4 block transform transition-transform active:scale-95 shadow-lg group"
            >
                <!-- বাটনের জন্য স্পিনিং ব্যাকগ্রাউন্ড -->
                <div class="absolute top-1/2 left-1/2 w-[800px] h-[800px] max-w-none conic-border-gradient animate-spin-fast pointer-events-none z-0" style="transform: translate(-50%, -50%);"></div>
                
                <!-- বাটনের ভেতরের অংশ -->
                <div class="relative z-10 w-full h-full rounded-full bg-color-changing flex items-center justify-center py-4 text-[1.15rem] font-bold text-white tracking-wide">
                    Google review
                </div>
            </a>

        </div>
    </main>

</body>
</html>
